name: CI

# Runs on every push and pull request to main, and can also be started by hand
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test   # only runs if the tests passed
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image (trains the model inside Docker)
        run: docker build -t spam-api .

      - name: Start the container
        run: docker run -d --name spam-api -p 8000:8000 spam-api

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is up after $i checks"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          exit 1

      - name: Smoke test /health and /predict
        run: |
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep '"model_loaded":true'
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text":"URGENT! Claim your cash reward now"}' | tee /dev/stderr | grep '"prediction":"spam"'

      - name: Show container logs if something failed
        if: failure()
        run: docker logs spam-api